<div style="max-width: 400px; margin: 4rem auto; padding: 2rem; border: 1px solid #e2e8f0; border-radius: 12px; background: #ffffff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
  <h2 style="text-align: center; margin-bottom: 1.5rem; color: #1a2332;">Connexion</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 1.25rem;">
      <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #475569;">Adresse Email</label>
      <input type="email" formControlName="email" placeholder="etudiant@unchk.sn"
             style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" />
      <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" style="color: #ef4444; font-size: 0.85rem; margin-top: 0.25rem;">
        Veuillez entrer une adresse email valide.
      </div>
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #475569;">Mot de passe</label>
      <input type="password" formControlName="password" placeholder="••••••••"
             style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" />
      <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" style="color: #ef4444; font-size: 0.85rem; margin-top: 0.25rem;">
        Le mot de passe doit contenir au moins 4 caractères.
      </div>
    </div>

    <div *ngIf="errorMessage()" style="background-color: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; text-align: center;">
      {{ errorMessage() }}
    </div>

    <button type="submit" style="width: 100%; background-color: #0284c7; color: white; padding: 0.75rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">
      Se connecter
    </button>
  </form>
</div>
