<!-- Navbar horizontale (visible uniquement si l'utilisateur est authentifié) -->
<header *ngIf="isAuthenticated()" class="navbar">
  <div class="nav-left">
    <h1 class="logo">Gotechedu</h1>
  </div>

  <nav class="nav-links">
    <a routerLink="/dashboard" routerLinkActive="active">
      Tableau de bord
    </a>
    <a routerLink="/courses" routerLinkActive="active">
      Cours
    </a>
    <a routerLink="/quiz" routerLinkActive="active">
      Quiz
    </a>
    <!-- Nouvel onglet pour le dépôt de devoirs/TP -->
    <a routerLink="/assignments" routerLinkActive="active">
      Dépôts
    </a>
  </nav>

  <div class="nav-right">
    <span class="user-name">Khadidiatou Traore</span>
    <button class="btn-logout" (click)="logout()">Déconnexion</button>
  </div>
</header>
